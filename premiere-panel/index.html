<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; padding: 10px; color: #e8eaf0; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    h2 { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; color: #8e97a8; margin: 14px 0 6px; }
    .row { display: flex; align-items: center; margin: 6px 0; }
    .row.wrap { flex-wrap: wrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: #777; }
    .dot.verbunden { background: #4cc38a; } .dot.arbeitet { background: #d4aa4f; }
    .dot.offline, .dot.getrennt { background: #ef5b5b; } .dot.suche { background: #5aa7ff; }
    .muted { color: #8e97a8; }
    button { font-size: 12px; padding: 4px 9px; margin: 0 5px 5px 0; border-radius: 4px; border: 1px solid #4a5163; background: #2b3040; color: #e8eaf0; cursor: pointer; }
    button:hover { background: #38405a; }
    button.primary { background: #3b6fd4; border-color: #3b6fd4; }
    button[disabled] { opacity: 0.45; cursor: default; }
    .label { width: 92px; flex: none; color: #c5cad6; }
    input, select { font-size: 12px; background: #1d2130; color: #e8eaf0; border: 1px solid #4a5163; border-radius: 4px; padding: 3px 6px; margin-right: 5px; }
    input.text { flex: 1; min-width: 80px; }
    input.num { width: 52px; }
    #tools { margin-top: 8px; }
    #log { margin-top: 12px; max-height: 300px; overflow: auto; font-family: monospace; font-size: 11px; }
    #log .warn { color: #e9b44c; } #log .err { color: #ef5b5b; } #log .ok { color: #4cc38a; }
  </style>
</head>
<body>
  <h1>Glorfindel</h1>
  <div class="muted" id="version"></div>
  <div class="row"><span class="dot" id="dot"></span><span id="status">Starte …</span></div>
  <div class="muted">Die App „Glorfindel starten“ muss laufen. Gebaut und getauscht wird dort; die Werkzeuge unten wirken auf die Auswahl in der Zeitleiste.</div>
  <div id="tools"></div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
