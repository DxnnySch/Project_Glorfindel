<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; padding: 10px; color: #e8eaf0; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .row { display: flex; align-items: center; margin: 8px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: #777; }
    .dot.verbunden { background: #4cc38a; } .dot.arbeitet { background: #d4aa4f; }
    .dot.offline, .dot.getrennt { background: #ef5b5b; } .dot.suche { background: #5aa7ff; }
    .muted { color: #8e97a8; }
    #log { margin-top: 10px; max-height: 360px; overflow: auto; font-family: monospace; font-size: 11px; }
    #log .warn { color: #e9b44c; } #log .err { color: #ef5b5b; }
  </style>
</head>
<body>
  <h1>Glorfindel</h1>
  <div class="muted" id="version"></div>
  <div class="row"><span class="dot" id="dot"></span><span id="status">Starte …</span></div>
  <div class="muted">Die App „Glorfindel starten“ muss laufen. Gebaut und getauscht wird dort, dieses Fenster nur offen lassen.</div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
